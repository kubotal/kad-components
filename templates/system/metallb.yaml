

templates:

  - name: metallb
    version: 1.0.0
    catalogs:
      - system
    parametersSchema:
      yaml:
        $schema: "http://json-schema.org/schema#"
        title: Metallb
        description: |
          Stack managing Load Balancer.
        type: object
        additionalProperties: false
        properties: {}
    contextSchema:
      yaml:
        $schema: "http://json-schema.org/schema#"
        type: object
        additionalProperties: true
        required:
          - metallb
        properties:
          metallb:
            type: object
            additionalProperties: true
            properties:
              kubernetes:
                type: object
                additionalProperties: false
                required:
                  - enabled
                properties:
                  enabled:
                    type: boolean
    body: |
      componentReleases:
      - name: metallb
        namespace: metallb
        component:
          name: metallb:metallb
          version: 1.0.0
      
      - name: metallb-pool
        namespace: metallb
        component:
          name: metallb:metallb-pool
          version: 1.0.0
